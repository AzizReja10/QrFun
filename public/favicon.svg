<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Neo-Brutalist Hard Drop Shadow -->
  <rect x="7" y="7" width="52" height="52" rx="14" fill="#000000" />

  <!-- Neo-Brutalist Card Body -->
  <rect x="4" y="4" width="52" height="52" rx="14" fill="#fde047" stroke="#000000" stroke-width="3.5" />

  <!-- 3D Voxel Isometric Cube -->
  <!-- Left Face (Voxel Sky Blue) -->
  <polygon points="14,23 30,32 30,48 14,39" fill="#38bdf8" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Right Face (Voxel Purple) -->
  <polygon points="30,32 46,23 46,39 30,48" fill="#a855f7" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Top Face (Cream Base) -->
  <polygon points="30,14 46,23 30,32 14,23" fill="#fffdeb" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

  <!-- QR Finder Pattern on Top Face (Isometric) -->
  <polygon points="30,17.2 39.6,23 30,28.8 20.4,23" fill="#000000" />
  <polygon points="30,19.2 36.4,23 30,26.8 23.6,23" fill="#fffdeb" />
  <polygon points="30,21 33.2,23 30,25 26.8,23" fill="#000000" />

  <!-- Left Face Voxel Detail Grid -->
  <line x1="22" y1="27.5" x2="22" y2="43.5" stroke="#000000" stroke-width="1.8" opacity="0.45" />
  <line x1="14" y1="31" x2="30" y2="40" stroke="#000000" stroke-width="1.8" opacity="0.45" />

  <!-- Right Face Voxel Detail Grid -->
  <line x1="38" y1="27.5" x2="38" y2="43.5" stroke="#000000" stroke-width="1.8" opacity="0.45" />
  <line x1="30" y1="40" x2="46" y2="31" stroke="#000000" stroke-width="1.8" opacity="0.45" />

  <!-- Outer Cube Contour Outline -->
  <polygon points="30,14 46,23 46,39 30,48 14,39 14,23" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Sparkling Star on top-right -->
  <path d="M49 7 L50.5 11.5 L55 13 L50.5 14.5 L49 19 L47.5 14.5 L43 13 L47.5 11.5 Z" fill="#fbbf24" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" />
</svg>